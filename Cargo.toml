[package]
name = "runemark"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Opinionated terminal presentation for Rust command-line tools"
license = "MIT"
documentation = "https://docs.rs/runemark"
repository = "https://github.com/casoon/runemark"
keywords = ["cli", "terminal", "reporting", "progress", "output"]
categories = ["command-line-interface", "command-line-utilities"]
exclude = ["todo.md", "bindings/**", "packages/**", "plan/**", "scripts/**", "site/**", "docs/**"]

# Without this, docs.rs builds default features only and the `progress` and
# `select` APIs never appear in the published documentation.
[package.metadata.docs.rs]
all-features = true

[features]
progress = ["dep:indicatif"]
select = ["dep:libc"]

[dependencies]
unicode-width = "0.2"
indicatif = { version = "0.18", optional = true }

# The interactive menu drives the terminal directly. Only a tty and termios are
# needed, so the feature is Unix-only rather than carrying a cross-platform
# terminal stack; elsewhere `Menu::run` reports `Outcome::Unavailable`.
# Menu::run only exists with the feature, so --all-targets must not try to
# build this example without it.
[[example]]
name = "select_demo"
required-features = ["select"]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
