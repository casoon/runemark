[package]
name = "runemark-node"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.6"
runemark = { path = "../..", version = "0.4.0", features = ["progress"] }

[build-dependencies]
napi-build = "2.4"
