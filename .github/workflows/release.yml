name: Release

# A version tag builds the native Node binaries and attaches them (plus
# SHA256SUMS) to the GitHub release.
#
# The crate is NOT published here. `cargo publish` is run from a maintainer
# machine, so the registry token stays there rather than in repository secrets,
# and releasing is a deliberate step instead of a side effect of pushing a tag.
# The npm package is published manually the same way:
# `npm run fetch:binaries && npm publish` in packages/runemark.
#
# `workflow_dispatch` runs only the metadata check and the binary builds, as a
# dry run before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-metadata:
    name: Verify Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-release-metadata.mjs

  build-node-bindings:
    name: Build Node binding (${{ matrix.target }})
    needs: verify-metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # glibc 2.17 sysroot, so the binary loads on older distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-args: --use-napi-cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-args: --use-napi-cross
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/runemark/package-lock.json
      - name: Install dependencies
        working-directory: packages/runemark
        run: npm ci
      - name: Build native binary
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: packages/runemark
        run: npx napi build --release --target ${{ matrix.target }} ${{ matrix.build-args }} --platform --manifest-path ../../bindings/node/Cargo.toml --package-json-path package.json --output-dir ../../packages/runemark --js native.cjs --dts native.d.ts
      # Build on a musl host: cross-linking from the glibc runner produces a binary
      # that needs the glibc loader (ld-linux-x86-64.so.2) and fails on Alpine.
      - name: Build native binary (Alpine container)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: >-
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/packages/runemark rust:1.88-alpine
          sh -c "apk add --no-cache nodejs npm gcc musl-dev
          && npm ci
          && npx napi build --release --target x86_64-unknown-linux-musl --platform --manifest-path ../../bindings/node/Cargo.toml --package-json-path package.json --output-dir ../../packages/runemark --js native.cjs --dts native.d.ts"
      - name: Runtime smoke test (host native)
        if: runner.os != 'Linux'
        working-directory: packages/runemark
        run: npm run test:smoke
      - name: Runtime smoke test (glibc 2.31 container)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/packages/runemark node:20-bullseye-slim npm run test:smoke
      - name: Runtime smoke test (musl container)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/packages/runemark node:20-alpine npm run test:smoke
      - name: Set up QEMU
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Runtime smoke test (arm64 glibc 2.31 container via QEMU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" -w /workspace/packages/runemark node:20-bullseye-slim npm run test:smoke
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/runemark/runemark.*.node
          if-no-files-found: error

  confirm-published:
    name: Confirm crates.io
    if: startsWith(github.ref, 'refs/tags/')
    # The crate is published from a maintainer machine before the tag is
    # pushed; this only checks that it actually was.
    needs: [verify-metadata, build-node-bindings]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the version is on crates.io
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: runemark release workflow' \
            "https://crates.io/api/v1/crates/runemark/${version}")"
          if [ "$status" != "200" ]; then
            echo "runemark ${version} is not on crates.io (HTTP ${status})."
            echo "Run 'cargo publish' locally before pushing the tag."
            exit 1
          fi
          echo "runemark ${version} is published."

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: confirm-published
    runs-on: ubuntu-latest
    steps:
      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: dist
          merge-multiple: true
      - name: Verify binaries and write checksums
        working-directory: dist
        run: |
          ls -la
          test "$(ls runemark.*.node | wc -l)" -eq 5
          sha256sum runemark.*.node > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/runemark.*.node
            dist/SHA256SUMS
