name: Release

# A version tag publishes the crate and attaches the native Node binaries (plus
# SHA256SUMS) to the GitHub release. The npm package is published manually from
# a maintainer machine: `npm run fetch:binaries && npm publish` in packages/runemark.
# `workflow_dispatch` runs only the metadata check and the binary builds, as a
# dry run before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-metadata:
    name: Verify Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-release-metadata.mjs

  build-node-bindings:
    name: Build Node binding (${{ matrix.target }})
    needs: verify-metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel runner, so the x64 binary can be smoke-tested natively.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # glibc 2.17 sysroot, so the binary loads on older distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-args: --use-napi-cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-args: --use-napi-cross
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/runemark/package-lock.json
      - name: Install dependencies
        working-directory: packages/runemark
        run: npm ci
      - name: Install musl dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build native binary
        working-directory: packages/runemark
        run: npx napi build --release --target ${{ matrix.target }} ${{ matrix.build-args }} --platform --manifest-path ../../bindings/node/Cargo.toml --package-json-path package.json --output-dir ../../packages/runemark --js native.cjs --dts native.d.ts
      - name: Runtime smoke test (host native)
        if: runner.os != 'Linux'
        working-directory: packages/runemark
        run: npm run test:smoke
      - name: Runtime smoke test (glibc 2.31 container)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/packages/runemark node:20-bullseye-slim npm run test:smoke
      - name: Runtime smoke test (musl container)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/packages/runemark node:20-alpine npm run test:smoke
      - name: Set up QEMU
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Runtime smoke test (arm64 glibc 2.31 container via QEMU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" -w /workspace/packages/runemark node:20-bullseye-slim npm run test:smoke
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/runemark/runemark.*.node
          if-no-files-found: error

  publish-crate:
    name: Publish crates.io
    if: startsWith(github.ref, 'refs/tags/')
    # Only publish the crate once every native binary for this version built and
    # passed its smoke test, so crate and npm releases cannot diverge.
    needs: [verify-metadata, build-node-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package
        run: cargo package --locked
      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-crate
    runs-on: ubuntu-latest
    steps:
      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: dist
          merge-multiple: true
      - name: Verify binaries and write checksums
        working-directory: dist
        run: |
          ls -la
          test "$(ls runemark.*.node | wc -l)" -eq 6
          sha256sum runemark.*.node > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/runemark.*.node
            dist/SHA256SUMS
