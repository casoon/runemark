version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo-root:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /bindings/node
    schedule:
      interval: monthly
    groups:
      cargo-node-binding:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/runemark
    schedule:
      interval: monthly
    groups:
      npm-package:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      npm-site:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types: [minor, patch]
